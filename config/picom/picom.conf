# ============================================================================
# tron-grid-dots — picom (~25-35 MB RSS with xrender on the N4000's UHD 600).
#
# NO BLUR — dual-kawase melts a Celeron. Accent-tinted shadows are injected
# at launch by bspwmrc / openbox autostart via --shadow-red/green/blue flags
# read from theme/palette.sh, so this file never needs regenerating.
# ============================================================================

# xrender is lighter + more stable than glx on gemini-lake iGPUs
backend = "xrender";
vsync = true;

# --- shadows (color comes from CLI flags) ------------------------------------
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Eww'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- opacity -----------------------------------------------------------------
# kitty gets its ~90% opacity from kitty.conf itself; keep everything else
# fully opaque so text stays crisp on the small panel.
inactive-opacity = 1.0;
active-opacity = 1.0;
opacity-rule = [
    "95:class_g = 'Rofi'"
];

# --- corners -----------------------------------------------------------------
corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'Polybar'"
];

# --- fading (cheap, short) ---------------------------------------------------
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

# --- perf --------------------------------------------------------------------
blur-background = false;
unredir-if-possible = true;        # fullscreen video bypasses the compositor
detect-transient = true;
detect-client-leader = true;
use-damage = true;
