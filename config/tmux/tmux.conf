# ============================================================================
# tron-grid-dots — tmux (~3 MB). Minimal accent status bar.
# Colors come from colors.gen.tmux (generated by theme/apply.sh).
# tmux >= 3.1 reads ~/.config/tmux/tmux.conf natively (noble ships 3.4).
# ============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -g default-shell /usr/bin/fish

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 10
set -g history-limit 5000        # modest: 4 GB machine
set -g status-interval 15

# splits keep cwd; | and - are easier to remember
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "RELOADED"

# status layout (colors in the generated file)
set -g status-position top
set -g status-justify left
set -g status-left-length 24
set -g status-right-length 24

source-file -q ~/.config/tmux/colors.gen.tmux
