#? Config file for btop — tron-grid-dots seed.
#? btop rewrites this file at runtime, which is why install.sh COPIES it
#? (once) instead of symlinking; later btop edits stay out of the repo.

color_theme = "tron"
theme_background = True
truecolor = True
vim_keys = True
rounded_corners = True
update_ms = 2000
proc_sorting = "memory"
proc_tree = False
show_uptime = True
check_temp = True
show_coretemp = True
mem_graphs = True
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
io_mode = False
base_10_sizes = False
log_level = "WARNING"
