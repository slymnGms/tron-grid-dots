; ============================================================================
; tron-grid-dots — polybar (~20-25 MB RSS). Single thin top bar.
; Colors come from colors.gen.ini (generated by theme/apply.sh).
; xworkspaces is used (not internal/bspwm) so the same bar works under both
; bspwm and openbox sessions.
; ============================================================================

include-file = ~/.config/polybar/colors.gen.ini

[bar/tron]
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-right = 1
module-margin = 1

; thin accent line under the whole bar
border-bottom-size = 1
border-bottom-color = ${colors.fg-dim}

font-0 = "JetBrainsMono Nerd Font:size=9;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
font-2 = "Orbitron:size=8:weight=bold;2"

modules-left = hud xworkspaces xwindow
modules-right = cpu memory network battery clock

enable-ipc = true
wm-restack = bspwm

; ------------------------------------------------------------- modules ------

[module/hud]
; launcher button for the eww dashboard
type = custom/text
label = "  GRID "
label-font = 3
label-foreground = ${colors.accent}
click-left = ~/.config/eww/scripts/hud-toggle.sh

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.warn}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.fg-dim}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:48:…%
label-foreground = ${colors.fg-dim}

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%
warn-percentage = 85
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.warn}
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.warn}

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid:0:12%
format-disconnected = <label-disconnected>
label-disconnected = "󰖪 OFFLINE"
label-disconnected-foreground = ${colors.warn}

[module/battery]
type = internal/battery
full-at = 97
battery = BAT0
adapter = AC0
poll-interval = 30
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.ok}
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
format-full-prefix = " "
format-full-prefix-foreground = ${colors.ok}
label-full = %percentage%%
ramp-capacity-0 =
ramp-capacity-0-foreground = ${colors.warn}
ramp-capacity-1 =
ramp-capacity-2 =
ramp-capacity-3 =
ramp-capacity-4 =
ramp-capacity-foreground = ${colors.accent}

[module/clock]
type = internal/date
interval = 30
date = %H:%M
date-alt = %a %d.%m.%Y  %H:%M
label = %date%
label-font = 3
label-foreground = ${colors.accent}

[settings]
screenchange-reload = true
pseudo-transparency = false
