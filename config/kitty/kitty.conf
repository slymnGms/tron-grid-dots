# ============================================================================
# tron-grid-dots — kitty (~80-100 MB per window; it's the priciest daily tool
# here but earns it with GPU text rendering even on UHD 600. If RAM gets
# tight, xterm/alacritty are drop-in cheaper.)
# Colors come from colors.gen.conf (generated by theme/apply.sh).
# ============================================================================

include colors.gen.conf

# --- font --------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        10.5
disable_ligatures never

# --- look --------------------------------------------------------------------
background_opacity 0.90
window_padding_width 8
cursor_shape beam
cursor_blink_interval 0.6
url_style single

# --- perf / memory (tuned for 4 GB) ------------------------------------------
scrollback_lines 4000
repaint_delay 12
input_delay 2
sync_to_monitor yes

# --- behavior ----------------------------------------------------------------
shell fish
confirm_os_window_close 0
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart

# --- keys --------------------------------------------------------------------
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
